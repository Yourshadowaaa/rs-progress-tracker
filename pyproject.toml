[project]
name = "rs-progress-tracker"
version = "0.1.0"
description = "Hourly XP and adventure log tracker for a RuneScape 3 account"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
